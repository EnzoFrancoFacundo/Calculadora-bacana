<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Calculadora online com modos padrão, científico e conversor de unidades." />
  <meta name="theme-color" content="#0b1120" />
  <title>Calculadora Pro — Padrão, Científica e Conversor</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#calculadora">Ir para a calculadora</a>
  <div id="root"></div>

  <!-- React + htm via CDN (sem Babel, sem transpilação) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>

  <!-- Lógica pura -->
  <script src="js/core.js"></script>
  <script src="js/config.js"></script>

  <!-- Helper htm vinculado ao React.createElement -->
  <script>
    window.html = htm.bind(React.createElement);
  </script>

  <!-- Componentes (classic scripts, funcionam em file://) -->
  <script src="js/converter.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
